# ==============================================================================
# 1. Service Account
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-service-account
  namespace: infra-ia

---
# ==============================================================================
# 2. ClusterRole (Permisos de administración extendidos)
# ==============================================================================
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: mcp-cluster-operator
rules:
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - ''
    resources:
      - nodes
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - configmaps
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
  - verbs:
      - create
    apiGroups:
      - ''
    resources:
      - pods/exec
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - networkpolicies
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - route.openshift.io
    resources:
      - routes
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - project.openshift.io
    resources:
      - projects
  - verbs:
      - get
      - list
    apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses

---
# ==============================================================================
# 3. ClusterRoleBinding (Asignación de permisos)
# ==============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-global-access
subjects:
  - kind: ServiceAccount
    name: mcp-service-account
    namespace: infra-ai
roleRef:
  kind: ClusterRole
  name: mcp-cluster-operator
  apiGroup: rbac.authorization.k8s.io
